<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book a fitting · Acme Outdoor</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header><h1>Book a gear fitting</h1><p>30 minutes with a fitting specialist. Free.</p></header>
    <label>Store<select id="store"></select></label>
    <label>Day<input id="day" type="date" /></label>
    <h2>Pick a time</h2>
    <div id="slots" class="slots"><span class="muted">Loading times…</span></div>
    <label>Your name<input id="name" placeholder="Jane Doe" autocomplete="name" /></label>
    <p id="result" role="status"></p>
    <footer><button id="book" disabled>Confirm booking</button></footer>
  </div>
  <script src="/app.js"></script>
</body>
</html>
